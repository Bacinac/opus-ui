<!doctype html>
<html lang="hr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.ico?v=20260921" sizes="48x48" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260921" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260921" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260921" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260921" />
		<link rel="manifest" href="/manifest.webmanifest?v=20260921" />
		<meta name="theme-color" content="#0e1213" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<title>OPUS</title>
		<script nonce="%sveltekit.nonce%">
			// Anti-FOUC: apply the stored theme before first paint. Must stay
			// synchronous and dependency-free.
			(function () {
				try {
					var t = localStorage.getItem('theme');
					var dark =
						t === 'dark' ||
						!t ||
						(t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
